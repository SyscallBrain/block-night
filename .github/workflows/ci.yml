name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, verify content and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (core, leveltool, app)
        run: ./gradlew :core:test :leveltool:test :app:testDebugUnitTest --console=plain

      - name: Strict catalog validation
        run: ./gradlew :leveltool:validateCatalog --console=plain

      - name: Certificate replay
        run: ./gradlew :leveltool:verifyCertificates --console=plain

      - name: Lint and debug APK
        run: ./gradlew :app:lintDebug :app:assembleDebug --console=plain

      - name: Unsigned release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: block-night-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
